<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TOTP Generator</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 128 128%22 overflow=%22hidden%22%3E%3Cg transform=%22translate(-1.5,4.5) scale(3.96875,3.96875) translate(0,0)%22%3E%3Cpath xmlns=%22http://www.w3.org/2000/svg%22 fill=%22%23f9c23c%22 d=%22M3 13a3 3 0 0 1 3-3h2l1.5-1 1 1h7L19 9l1 1h2a3 3 0 0 1 3 3v13a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3z%22/%3E%3Cpath xmlns=%22http://www.w3.org/2000/svg%22 fill=%22%23433b6b%22 d=%22M15.5 19.5a2.5 2.5 0 1 0-3 0V23a1.5 1.5 0 0 0 3 0z%22/%3E%3Cpath xmlns=%22http://www.w3.org/2000/svg%22 fill=%22%23d3d3d3%22 d=%22M14 1a6 6 0 0 0-6 6v3h2.5V7a3.5 3.5 0 1 1 7 0v3H20V7a6 6 0 0 0-6-6M30 9.5a4.5 4.5 0 0 1-3 4.244V22.5a1.5 1.5 0 0 1-3 0v-1.754c0-.2.078-.39.216-.52l.313-.31a.723.723 0 0 0 0-1.04.71.71 0 0 1 0-1.03.723.723 0 0 0 0-1.04l-.313-.31a.73.73 0 0 1-.216-.52v-2.232A4.502 4.502 0 0 1 25.5 5 4.5 4.5 0 0 1 30 9.5M25.5 8a1 1 0 1 0 0-2 1 1 0 0 0 0 2%22/%3E%3C/g%3E%3C/svg%3E"
    />
    <script src="qr-code.js"></script>
    <link rel="stylesheet" href="./style.css" />
  </head>

  <body>
    <a class="github-link" href="#" aria-label="GitHub repository">GitHub</a>

    <main>
      <h1>TOTP Generator</h1>
      <p class="tagline">
        Generate time-based one-time passwords from a secret.
      </p>

      <form id="form" autocomplete="off">
        <label for="secret">Secret</label>
        <input
          id="secret"
          name="secret"
          type="password"
          autocomplete="off"
          autocorrect="off"
          autocapitalize="off"
          spellcheck="false"
          autofocus
          required
        />

        <button type="submit">Generate</button>
      </form>

      <p id="error" class="error" role="alert"></p>

      <section id="output" class="output">
        <div id="code" class="code">------</div>
        <div id="timer" class="timer"></div>
        <div id="qrcode"></div>
      </section>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
